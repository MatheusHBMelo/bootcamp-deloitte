<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CRUD de usuários</title>

    <!-- Aqui eu declaro o bootstrap para templates e o de icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
          background-color: #f0f2f5;
        }
        .card {
          border: none;
          border-radius: 12px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .toast-container {
          position: fixed;
          bottom: 1.5rem;
          right: 1.5rem;
          z-index: 9999;
        }
    </style>
</head>
<body>
<!-- isso habilita do alpine js como se criasse um objeto -->
<div x-data="usuarioApp()">
    <div class="toast-container">
        <div class="toast align-items-center border-0"
             :class="toast.tipo === 'sucesso' ? 'text-bg-success' : 'text-bg-danger'"
             x-show="toast.visivel"
             x-transition
             role="alert">
            <div class="d-flex">
                <div class="toast-body fw-semibold" x-text="toast.mensagem"></div>
                <button class="btn-close btn-close-white me-2 m-auto" @click="toast.visivel = false"></button>
            </div>
        </div>
    </div>

    <!-- Essa parte coloca um navbar azul com o nome do projeto e meu nome-->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
          <span class="navbar-brand fw-bold fs-4">
            <i class="bi bi-people-fill me-2"></i>CRUD de Usuários
          </span>
            <span class="text-white-50 small">Matheus Barbosa</span>
        </div>
    </nav>

    <!-- container principal da tela, padrão do bootstrap -->
    <div class="container pb-5">
        <!-- Um alinhamento legal para o meiol da tela -->
        <div class="row justify-content-center">
            <!-- Formulario do usuario com as variaveis mapeadas no spring -->
            <div class="col-lg-5">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">
                        <i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastrar Usuário
                    </h5>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" placeholder="Nome completo"
                                   x-model="form.nome"
                                   :class="erros.nome ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.nome"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="email@exemplo.com"
                                   x-model="form.email"
                                   :class="erros.email ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.email"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" placeholder="000.000.000-00"
                                   x-model="form.cpf"
                                   :class="erros.cpf ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.cpf"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Telefone</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" placeholder="(81) 99999-9999"
                                   x-model="form.telefone"
                                   :class="erros.telefone ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.telefone"></div>
                        </div>
                    </div>

                    <button class="btn btn-primary fw-semibold w-100" @click="cadastrar()">
                        <i class="bi bi-plus-lg me-1"></i>Cadastrar Usuário
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function usuarioApp() {
      const API_BASE = 'http://localhost:8080/usuarios';

      return {
        form: { id: null, nome: '', email: '', cpf: '', telefone: '' },
        erros: {},
        toast: { visivel: false, mensagem: '', tipo: 'sucesso' },

        // Cadastrar
        async cadastrar() {
          if (!this.validar()) return;

          try {
            const res = await fetch(API_BASE, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });

            if (!res.ok) throw new Error('Erro ao cadastrar usuário');

            this.resetForm();
            this.mostrarToast('Usuário cadastrado com sucesso!', 'sucesso');
          } catch (e) {
            this.mostrarToast('Erro: ' + e.message, 'erro');
          }
        },

        // Validação
        validar() {
          this.erros = {};
          if (!this.form.nome?.trim())     this.erros.nome     = 'Nome é obrigatório.';
          if (!this.form.email?.trim())    this.erros.email    = 'E-mail é obrigatório.';
          if (!this.form.cpf?.trim())      this.erros.cpf      = 'CPF é obrigatório.';
          if (!this.form.telefone?.trim()) this.erros.telefone = 'Telefone é obrigatório.';
          return Object.keys(this.erros).length === 0;
        },

        // Correções
        resetForm() {
          this.form = { id: null, nome: '', email: '', cpf: '', telefone: '' };
          this.erros = {};
        },

        mostrarToast(mensagem, tipo = 'sucesso') {
          this.toast = { visivel: true, mensagem, tipo };
          setTimeout(() => this.toast.visivel = false, 3500);
        },
      };
    }
</script>
</body>
</html>
