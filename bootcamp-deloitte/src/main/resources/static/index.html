<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CRUD de usuários</title>

    <!-- Aqui eu declaro o bootstrap para templates e o de icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
          background-color: #f0f2f5;
        }
        .card {
          border: none;
          border-radius: 12px;
          box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }
        .toast-container {
          position: fixed;
          top: 1.5rem;
          left: 50%;
          transform: translateX(-50%);
          z-index: 9999;
        }
        .badge-id {
        background: #e9ecef;
        color: #495057;
        font-size: .75rem;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 20px;
        }

        .spinner-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9998; }
    </style>
</head>
<body>
<!-- isso habilita do alpine js como se criasse um objeto -->
<div x-data="usuarioApp()" x-init="listar()">

    <div class="spinner-overlay" x-show="carregando">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="toast-container">
        <template x-if="toast.visivel">
            <div class="toast align-items-center border-0 show"
                 :class="toast.tipo === 'sucesso' ? 'text-bg-success' : 'text-bg-danger'"
                 role="alert">
                <div class="d-flex">
                    <div class="toast-body fw-semibold" x-text="toast.mensagem"></div>
                    <button class="btn-close btn-close-white me-2 m-auto" @click="toast.visivel = false"></button>
                </div>
            </div>
        </template>
    </div>

    <!-- Essa parte coloca um navbar azul com o nome do projeto e meu nome-->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
          <span class="navbar-brand fw-bold fs-4">
            <i class="bi bi-people-fill me-2"></i>CRUD de Usuários
          </span>
            <span class="text-white-50 small">Matheus Barbosa</span>
        </div>
    </nav>

    <!-- container principal da tela, padrão do bootstrap -->
    <div class="container pb-5">
        <!-- Formulario do usuario com as variaveis mapeadas no spring -->
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">
                        <i class="bi me-2"
                           :class="editando ? 'bi-pencil-square text-warning' : 'bi-person-plus-fill text-primary'"></i>
                        <span x-text="editando ? 'Editar Usuário' : 'Cadastrar Usuário'"></span>
                    </h5>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" placeholder="Nome completo"
                                   x-model="form.nome"
                                   :class="erros.nome ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.nome"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="email@exemplo.com"
                                   x-model="form.email"
                                   :class="erros.email ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.email"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" placeholder="000.000.000-00"
                                   x-model="form.cpf"
                                   :class="erros.cpf ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.cpf"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Telefone</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" placeholder="81999999999"
                                   x-model="form.telefone"
                                   :class="erros.telefone ? 'is-invalid' : ''"
                            />
                            <div class="invalid-feedback" x-text="erros.telefone"></div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn fw-semibold"
                                :class="editando ? 'btn-warning' : 'btn-primary'"
                                @click="editando ? atualizar() : cadastrar()">
                            <i class="bi me-1" :class="editando ? 'bi-check-lg' : 'bi-plus-lg'"></i>
                            <span x-text="editando ? 'Salvar Alterações' : 'Cadastrar Usuário'"></span>
                        </button>

                        <button class="btn btn-outline-secondary" x-show="editando" @click="cancelarEdicao()">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h5 class="mb-0 fw-bold">
                            <i class="bi bi-list-ul me-2 text-primary"></i>Lista de Usuários
                        </h5>
                        <span class="badge bg-primary rounded-pill" x-text="usuarios.length + ' registros'"></span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th class="text-center">Ações</th>
                            </tr>
                            </thead>
                            <tbody>
                            <template x-if="usuarios.length === 0">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-5">
                                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                        Nenhum usuário cadastrado.
                                    </td>
                                </tr>
                            </template>

                            <template x-for="u in usuariosPaginados" :key="u.id">
                                <tr>
                                    <td><span class="badge-id" x-text="u.id"></span></td>
                                    <td class="fw-semibold" x-text="u.nome"></td>
                                    <td class="text-muted small" x-text="u.email"></td>
                                    <td class="text-muted small" x-text="formatarCPF(u.cpf)"></td>
                                    <td class="text-muted small" x-text="formatarTelefone(u.telefone)"></td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-warning" @click="editar(u)">
                                            <i class="bi bi-pencil-fill"></i>
                                        </button>
                                        <button class="btn btn-sm btn-danger" @click="confirmarDelete(u)">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            </tbody>
                        </table>
                        <div class="d-flex justify-content-center align-items-center py-3 gap-2" x-show="totalPaginas > 1">
                            <button class="btn btn-sm btn-outline-primary"
                                    :disabled="paginaAtual === 1"
                                    @click="paginaAtual--">
                                <i class="bi bi-chevron-left"></i>
                            </button>

                            <template x-for="p in totalPaginas" :key="p">
                                <button class="btn btn-sm"
                                        :class="paginaAtual === p ? 'btn-primary' : 'btn-outline-primary'"
                                        @click="paginaAtual = p"
                                        x-text="p">
                                </button>
                            </template>

                            <button class="btn btn-sm btn-outline-primary"
                                    :disabled="paginaAtual === totalPaginas"
                                    @click="paginaAtual++">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalDelete" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-danger">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Exclusão
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir o usuário
                    <strong x-text="usuarioParaDeletar?.nome"></strong>?
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" @click="deletar()">
                        <i class="bi bi-trash-fill me-1"></i>Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function usuarioApp() {
      const API_BASE = '/usuarios';

      return {
        usuarios: [],
        carregando: false,
        editando: false,
        usuarioParaDeletar: null,
        paginaAtual: 1,
        porPagina: 7,
        form: { id: null, nome: '', email: '', cpf: '', telefone: '' },
        erros: {},
        toast: { visivel: false, mensagem: '', tipo: 'sucesso' },

        // Cordena a paginação da lista de usuarios
        get totalPaginas() {
            return Math.ceil(this.usuarios.length / this.porPagina);
        },

        get usuariosPaginados() {
            const inicio = (this.paginaAtual - 1) * this.porPagina;
            const fim = inicio + this.porPagina;
            return this.usuarios.slice(inicio, fim);
        },

        // Listar os usuarios do crud
        async listar() {
        this.carregando = true;
        try {
            const res = await fetch(API_BASE);
            if (!res.ok) throw new Error('Erro ao buscar usuários');
            this.usuarios = await res.json();
            this.paginaAtual = 1;
        } catch (e) {
            this.mostrarToast('Erro ao conectar com a API: ' + e.message, 'erro');
        } finally {
                this.carregando = false;
            }
        },

        editar(u) {
            this.form = { ...u };
            this.editando = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        // Função que atualiza o usuario com validação
        async atualizar() {
            if (!this.validar()) return;
            this.carregando = true;
            try {
                const res = await fetch(`${API_BASE}/${this.form.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error);
                }
                await this.listar();
                this.resetForm();
                this.editando = false;
                this.mostrarToast('Usuário atualizado com sucesso!', 'sucesso');
            } catch (e) {
                this.mostrarToast(e.message, 'erro');
            } finally {
                this.carregando = false;
            }
        },

        cancelarEdicao() {
            this.resetForm();
            this.editando = false;
        },

        confirmarDelete(u) {
            this.usuarioParaDeletar = u;
            new bootstrap.Modal(document.getElementById('modalDelete')).show();
        },

        // Função que deleta um usuario
        async deletar() {
            bootstrap.Modal.getInstance(document.getElementById('modalDelete')).hide();
            this.carregando = true;
            try {
                const res = await fetch(`${API_BASE}/${this.usuarioParaDeletar.id}`, {
                    method: 'DELETE'
                });
                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.error);
                }
                await this.listar();
                this.mostrarToast('Usuário excluído com sucesso!', 'sucesso');
            } catch (e) {
                this.mostrarToast(e.message, 'erro');
            } finally {
                this.carregando = false;
            }
        },

        // Cadastrar os usuarios do crud
        async cadastrar() {
          if (!this.validar()) return;
          this.carregando = true;
          try {
            const res = await fetch(API_BASE, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(this.form)
            });

            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.error);
            }
            await this.listar();
            this.resetForm();
            this.mostrarToast('Usuário cadastrado com sucesso!', 'sucesso');
          } catch (e) {
            this.mostrarToast(e.message, 'erro');
          } finally {
            this.carregando = false;
          }
        },

        // Validação dos campos
        validar() {
          this.erros = {};
          if (!this.form.nome?.trim())     this.erros.nome     = 'Nome é obrigatório.';
          if (!this.form.email?.trim())    this.erros.email    = 'E-mail é obrigatório.';
          if (!this.form.cpf?.trim())      this.erros.cpf      = 'CPF é obrigatório.';
          if (!this.form.telefone?.trim()) this.erros.telefone = 'Telefone é obrigatório.';
          return Object.keys(this.erros).length === 0;
        },

        // Correções
        resetForm() {
          this.form = { id: null, nome: '', email: '', cpf: '', telefone: '' };
          this.erros = {};
        },

        // Mostra as mensagens de erro
        mostrarToast(mensagem, tipo = 'sucesso') {
          this.toast = { visivel: true, mensagem, tipo };
          setTimeout(() => this.toast.visivel = false, 6000);
        },

        formatarCPF(v) {
            return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        },

        formatarTelefone(v) {
            if (v.length === 11)
                return v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            return v.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
        },
      };
    }
</script>
</body>
</html>
