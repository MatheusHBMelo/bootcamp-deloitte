<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>CRUD de usuários</title>

    <!-- Aqui eu declaro o bootstrap para templates e o de icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

    <!-- Essa parte coloca um navbar azul com o nome do projeto e meu nome-->
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
          <span class="navbar-brand fw-bold fs-4">
            <i class="bi bi-people-fill me-2"></i>CRUD de Usuários
          </span>
            <span class="text-white-50 small">Matheus Barbosa</span>
        </div>
    </nav>

    <!-- container principal da tela, padrão do bootstrap -->
    <div class="container pb-5">
        <!-- Um alinhamento legal para o meiol da tela -->
        <div class="row justify-content-center">
            <!-- Formulario do usuario com as variaveis mapeadas no spring -->
            <div class="col-lg-5">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">
                        <i class="bi bi-person-plus-fill text-primary me-2"></i>Cadastrar Usuário
                    </h5>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" placeholder="Nome completo"/>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" placeholder="email@exemplo.com"/>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">CPF</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" placeholder="000.000.000-00"/>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Telefone</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                            <input type="text" class="form-control" placeholder="(81) 99999-9999"/>
                        </div>
                    </div>

                    <button class="btn btn-primary fw-semibold w-100">
                        <i class="bi bi-plus-lg me-1"></i>Cadastrar Usuário
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
